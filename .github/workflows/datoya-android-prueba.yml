name: DatoYa Android Prueba
on:
  workflow_dispatch:
  push:
    branches: [android-prueba-google]
    paths:
      - 'android-prueba/**'
      - '.github/workflows/datoya-android-prueba.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Write SHA256 signing certificate fingerprint
        run: |
          keytool -exportcert -rfc -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android > debug-certificate.pem
          openssl x509 -in debug-certificate.pem -noout -fingerprint -sha256 | sed 's/^sha256 Fingerprint=/SHA-256: /I' > SHA256-GOOGLE.txt
          test -s SHA256-GOOGLE.txt
          cat SHA256-GOOGLE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DatoYa-Pruebas-APK-y-SHA256
          path: |
            android-prueba/app/build/outputs/apk/debug/app-debug.apk
            android-prueba/SHA256-GOOGLE.txt
          retention-days: 30
