name: DatoYa Android Prueba
on:
  workflow_dispatch:
  push:
    branches: [android-prueba-google]
    paths:
      - 'android-prueba/**'
      - '.github/workflows/datoya-android-prueba.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Write SHA256 signing certificate fingerprint
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep 'SHA256:' | sed 's/^[[:space:]]*//' > SHA256-GOOGLE.txt
          cat SHA256-GOOGLE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DatoYa-Pruebas-APK-y-SHA256
          path: |
            android-prueba/app/build/outputs/apk/debug/app-debug.apk
            android-prueba/SHA256-GOOGLE.txt
          retention-days: 30
