name: DatoYa Android firmado
on:
  workflow_dispatch:
  push:
    branches: [android-prueba-google]
    paths:
      - 'android-prueba/**'
      - '.github/workflows/datoya-android-firmado.yml'
      - 'brand/pwa/icon-512.png'
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore protected signing key
        env:
          ENCODED_KEY: ${{ secrets.DATOYA_TEST_KEYSTORE_B64 }}
          SIGN_PASSWORD: ${{ secrets.DATOYA_TEST_STORE_PASSWORD }}
        run: |
          test -n "$ENCODED_KEY"
          test -n "$SIGN_PASSWORD"
          printf '%s' "$ENCODED_KEY" | base64 --decode > "$RUNNER_TEMP/datoya-pruebas.jks"
          echo "DATOYA_SIGNING_KEYSTORE=$RUNNER_TEMP/datoya-pruebas.jks" >> "$GITHUB_ENV"
      - name: Add original DatoYa icon
        run: |
          test -s ../brand/pwa/icon-512.png
          mkdir -p app/src/main/res/drawable-nodpi
          cp ../brand/pwa/icon-512.png app/src/main/res/drawable-nodpi/datoya_original.png
      - name: Compile release
        env:
          DATOYA_STORE_PASSWORD: ${{ secrets.DATOYA_TEST_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify correct branch and 1.3 source
        run: |
          test "$GITHUB_REF_NAME" = "android-prueba-google"
          grep -q 'versionCode 4' app/build.gradle
          grep -q 'Bienvenido a DatoYa' app/src/main/java/cl/datoya/pruebas2026/MainActivity.java
          grep -q 'datoya_original' app/src/main/AndroidManifest.xml
          test -s app/src/main/java/cl/datoya/pruebas2026/NativeToolbar.java
          grep -q 'NativeToolbar' app/src/main/java/cl/datoya/pruebas2026/MainActivity.java
          grep -q 'dy_bell' app/src/main/java/cl/datoya/pruebas2026/NativeToolbar.java
      - name: Validate APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "versionCode='4'" apk-badging.txt
          grep -q "application-label:'DatoYa'" apk-badging.txt
          unzip -l "$APK" | grep -q 'res/'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee signing-info.txt
          awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' signing-info.txt > SHA256-GOOGLE.txt
          grep -Eq '^[[:xdigit:]]{64}$' SHA256-GOOGLE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DatoYa-APK-firma-estable
          path: |
            android-prueba/app/build/outputs/apk/release/app-release.apk
            android-prueba/SHA256-GOOGLE.txt
            android-prueba/apk-badging.txt
          retention-days: 30
