name: Repair protection bootstrap 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair malformed protection SQL string
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('protection_bootstrap.js')
          s=p.read_text()
          old="db.prepare('UPDATE payment_protections SET status=?,resolution=?,resolved_by=?,updated_at=datetime(\\'now\\') WHERE job_id=?').run(status,resolution,req.user.id,job.id);"
          new='db.prepare("UPDATE payment_protections SET status=?,resolution=?,resolved_by=?,updated_at=datetime(\'now\') WHERE job_id=?").run(status,resolution,req.user.id,job.id);'
          if old not in s:
              raise SystemExit('Target malformed protection SQL string not found; refusing unrelated changes.')
          p.write_text(s.replace(old,new,1))
          PY
          node --check protection_bootstrap.js
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protection_bootstrap.js
          git rm .github/workflows/repair-protection2.yml
          git commit -m "Fix: corregir SQL de resolución protegida"
          git push
