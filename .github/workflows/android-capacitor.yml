name: Build DatoYa Capacitor APK

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - 'styles.css'
      - 'index.html'
      - '.github/workflows/android-capacitor.yml'
  pull_request:
    paths:
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android-capacitor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install --no-save @capacitor/core@latest @capacitor/android@latest @capacitor/cli@latest @capacitor/app@latest @capacitor/status-bar@latest @capacitor/splash-screen@latest
          npx cap add android

      - name: Install image tooling
        run: python3 -m pip install --user Pillow

      - name: Configure Android identity and icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          from collections import deque
          src=Image.open('brand/pwa/icon-512.png').convert('RGBA')

          # Quita solo el blanco exterior conectado a los bordes. Conserva el blanco interno del local.
          px=src.load(); W,H=src.size
          seen=set(); q=deque()
          def near_white(x,y):
              r,g,b,a=px[x,y]
              return a>0 and r>=232 and g>=232 and b>=232
          for x in range(W):
              for y in (0,H-1):
                  if near_white(x,y) and (x,y) not in seen:
                      seen.add((x,y)); q.append((x,y))
          for y in range(H):
              for x in (0,W-1):
                  if near_white(x,y) and (x,y) not in seen:
                      seen.add((x,y)); q.append((x,y))
          while q:
              x,y=q.popleft()
              px[x,y]=(255,255,255,0)
              for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                  if 0<=nx<W and 0<=ny<H and (nx,ny) not in seen and near_white(nx,ny):
                      seen.add((nx,ny)); q.append((nx,ny))
          bbox=src.getchannel('A').getbbox()
          if bbox:
              src=src.crop(bbox)
          side=max(src.size)
          square=Image.new('RGBA',(side,side),(0,0,0,0))
          square.alpha_composite(src,((side-src.width)//2,(side-src.height)//2))
          src=square.resize((512,512),Image.Resampling.LANCZOS)
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          scales={'mipmap-mdpi':1,'mipmap-hdpi':1.5,'mipmap-xhdpi':2,'mipmap-xxhdpi':3,'mipmap-xxxhdpi':4}
          for folder,size in sizes.items():
              p=root/folder
              p.mkdir(parents=True,exist_ok=True)
              im=src.resize((size,size),Image.Resampling.LANCZOS)
              im.save(p/'ic_launcher.png')
              im.save(p/'ic_launcher_round.png')
              fg_size=round(108*scales[folder])
              fg=Image.new('RGBA',(fg_size,fg_size),(0,0,0,0))
              logo=src.copy()
              logo.thumbnail((round(fg_size*.76),round(fg_size*.76)),Image.Resampling.LANCZOS)
              fg.alpha_composite(logo,((fg_size-logo.width)//2,(fg_size-logo.height)//2))
              fg.save(p/'ic_launcher_foreground.png')

          values=root/'values'
          values.mkdir(parents=True,exist_ok=True)
          colors=values/'colors.xml'
          if colors.exists():
              text=colors.read_text()
              if 'datoya_launcher_background' not in text:
                  text=text.replace('</resources>','    <color name="datoya_launcher_background">#0B3A82</color>\n</resources>')
                  colors.write_text(text)
          else:
              colors.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="datoya_launcher_background">#0B3A82</color>\n</resources>\n')
          anydpi=root/'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True,exist_ok=True)
          adaptive='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/datoya_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          (anydpi/'ic_launcher.xml').write_text(adaptive)
          (anydpi/'ic_launcher_round.xml').write_text(adaptive)

          # Splash real de DatoYa: fondo azul + logo centrado.
          canvas=Image.new('RGBA',(1080,1920),(11,58,130,255))
          logo=src.copy()
          logo.thumbnail((420,420),Image.Resampling.LANCZOS)
          x=(canvas.width-logo.width)//2
          y=(canvas.height-logo.height)//2 - 80
          canvas.alpha_composite(logo,(x,y))
          d=root/'drawable-nodpi'
          d.mkdir(parents=True,exist_ok=True)
          canvas.convert('RGB').save(d/'datoya_splash.png',quality=95)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="@string/app_name"', 'android:label="@string/app_name" android:usesCleartextTraffic="false"')
          p.write_text(s)
          PY
          npx cap sync android

          # Android 15/16: confina físicamente el WebView entre las barras del sistema.
          cat > android/app/src/main/java/cl/datoya/app/MainActivity.java <<'JAVA'
          package cl.datoya.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setBackgroundColor(Color.WHITE);
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  controller.setAppearanceLightStatusBars(true);
                  controller.setAppearanceLightNavigationBars(true);

                  View webView = this.bridge.getWebView();

                  ViewCompat.setOnApplyWindowInsetsListener(webView, (v, windowInsets) -> {
                      Insets bars = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars());

                      ViewGroup.LayoutParams raw = v.getLayoutParams();
                      if (raw instanceof ViewGroup.MarginLayoutParams) {
                          ViewGroup.MarginLayoutParams lp = (ViewGroup.MarginLayoutParams) raw;
                          if (lp.topMargin != bars.top || lp.bottomMargin != bars.bottom) {
                              lp.topMargin = bars.top;
                              lp.bottomMargin = bars.bottom;
                              v.setLayoutParams(lp);
                          }
                      }
                      return windowInsets;
                  });

                  ViewCompat.requestApplyInsets(webView);
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/app/src/main/res')
          # Usa el splash de DatoYa en versiones antiguas y el logo en Android 12+.
          for p in list(root.glob('values*/styles.xml')) + list(root.glob('values*/themes.xml')):
              s=p.read_text()
              s=s.replace('@drawable/splash','@drawable/datoya_splash')
              if 'windowSplashScreenAnimatedIcon' in s:
                  s=re.sub(r'(<item\s+name=["\'](?:android:)?windowSplashScreenAnimatedIcon["\']>).*?(</item>)',r'\1@mipmap/ic_launcher\2',s)
              if 'windowSplashScreenBackground' in s:
                  s=re.sub(r'(<item\s+name=["\'](?:android:)?windowSplashScreenBackground["\']>).*?(</item>)',r'\1#0B3A82\2',s)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          candidates=[Path('android/app/build.gradle'),Path('android/app/build.gradle.kts')]
          p=next((x for x in candidates if x.exists()),None)
          if not p:
              raise SystemExit('No se encontró build.gradle de Android')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 5', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "2.3.0"', s)
          p.write_text(s)
          print('DatoYa Android versionCode=5 versionName=2.3.0')
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/DatoYa-Capacitor-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datoya-capacitor-apk
          path: android-output/DatoYa-Capacitor-unsigned.apk
          if-no-files-found: error
