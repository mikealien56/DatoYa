name: Build DatoYa Capacitor APK

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android-capacitor.yml'
  pull_request:
    paths:
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android-capacitor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install --no-save @capacitor/core@latest @capacitor/android@latest @capacitor/cli@latest @capacitor/app@latest @capacitor/status-bar@latest @capacitor/splash-screen@latest
          npx cap add android

      - name: Install image tooling
        run: python3 -m pip install --user Pillow

      - name: Configure Android identity and icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('brand/pwa/icon-512.png').convert('RGBA')
          root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              p=root/folder
              p.mkdir(parents=True,exist_ok=True)
              im=src.resize((size,size),Image.Resampling.LANCZOS)
              im.save(p/'ic_launcher.png')
              im.save(p/'ic_launcher_round.png')

          # Splash real de DatoYa: fondo azul + logo centrado.
          canvas=Image.new('RGBA',(1080,1920),(11,58,130,255))
          logo=src.copy()
          logo.thumbnail((420,420),Image.Resampling.LANCZOS)
          x=(canvas.width-logo.width)//2
          y=(canvas.height-logo.height)//2 - 80
          canvas.alpha_composite(logo,(x,y))
          d=root/'drawable-nodpi'
          d.mkdir(parents=True,exist_ok=True)
          canvas.convert('RGB').save(d/'datoya_splash.png',quality=95)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="@string/app_name"', 'android:label="@string/app_name" android:usesCleartextTraffic="false"')
          p.write_text(s)
          PY
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/app/src/main/res')
          # Usa el splash de DatoYa en versiones antiguas y el logo en Android 12+.
          for p in list(root.glob('values*/styles.xml')) + list(root.glob('values*/themes.xml')):
              s=p.read_text()
              s=s.replace('@drawable/splash','@drawable/datoya_splash')
              if 'windowSplashScreenAnimatedIcon' in s:
                  s=re.sub(r'(<item\s+name=["\'](?:android:)?windowSplashScreenAnimatedIcon["\']>).*?(</item>)',r'\1@mipmap/ic_launcher\2',s)
              if 'windowSplashScreenBackground' in s:
                  s=re.sub(r'(<item\s+name=["\'](?:android:)?windowSplashScreenBackground["\']>).*?(</item>)',r'\1#0B3A82\2',s)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          candidates=[Path('android/app/build.gradle'),Path('android/app/build.gradle.kts')]
          p=next((x for x in candidates if x.exists()),None)
          if not p:
              raise SystemExit('No se encontró build.gradle de Android')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 3', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "2.1.0"', s)
          p.write_text(s)
          print('DatoYa Android versionCode=3 versionName=2.1.0')
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/DatoYa-Capacitor-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datoya-capacitor-apk
          path: android-output/DatoYa-Capacitor-unsigned.apk
          if-no-files-found: error
