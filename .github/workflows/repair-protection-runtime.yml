name: Repair protection runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add runtime SQL normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('protection_bootstrap.js')
          s=p.read_text()
          old="if (path.resolve(String(file)) === path.resolve(serverFile) && typeof value === 'string') return injectProtection(value);"
          new="if (path.resolve(String(file)) === path.resolve(serverFile) && typeof value === 'string') { let patched=injectProtection(value); patched=patched.replace(\"db.prepare('UPDATE payment_protections SET status=?,resolution=?,resolved_by=?,updated_at=datetime('now') WHERE job_id=?').run(status,resolution,req.user.id,job.id);\", \"db.prepare(\\\"UPDATE payment_protections SET status=?,resolution=?,resolved_by=?,updated_at=datetime('now') WHERE job_id=?\\\").run(status,resolution,req.user.id,job.id);\"); return patched; }"
          if old not in s:
              raise SystemExit('Injection point not found; refusing unrelated changes.')
          p.write_text(s.replace(old,new,1))
          PY
          node --check protection_bootstrap.js
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protection_bootstrap.js
          git rm .github/workflows/repair-protection-runtime.yml
          git commit -m "Fix: normalizar SQL del runtime de protección"
          git push
