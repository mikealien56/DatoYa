name: DatoYa PostgreSQL mode

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-mode:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datoya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datoya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEMO_MODE: "false"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/datoya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: bash test_postgres_smoke.sh
