name: DatoYa PostgreSQL mode

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-mode:
    runs-on: ubuntu-24.04
    env:
      DEMO_MODE: "false"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/datoya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='datoya_test'" | grep -q 1 || sudo -u postgres createdb datoya_test
          pg_isready -h 127.0.0.1 -U postgres -d datoya_test
      - run: npm install
      - name: Smoke PostgreSQL
        run: bash test_postgres_smoke.sh
      - name: Reset PostgreSQL before E2E
        run: |
          sudo -u postgres psql -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='datoya_test' AND pid <> pg_backend_pid();" postgres
          sudo -u postgres dropdb --if-exists datoya_test
          sudo -u postgres createdb datoya_test
          pg_isready -h 127.0.0.1 -U postgres -d datoya_test
      - name: E2E real PostgreSQL
        run: bash test_postgres_e2e.sh
