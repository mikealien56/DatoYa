name: DatoYa Khipu payments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sqlite-khipu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Khipu runtime smoke test
        run: KHIPU_TEST_PORT=3101 bash test_khipu_runtime.sh
