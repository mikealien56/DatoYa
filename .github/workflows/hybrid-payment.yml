name: DatoYa Khipu payments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sqlite-khipu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Khipu runtime smoke test
        run: KHIPU_TEST_PORT=3101 bash test_khipu_runtime.sh

  postgres-khipu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datoya_khipu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datoya_khipu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/datoya_khipu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Khipu runtime smoke test on PostgreSQL
        run: KHIPU_TEST_DB_DRIVER=postgres KHIPU_TEST_PORT=3102 bash test_khipu_runtime.sh
