name: Android TWA unsigned build

on:
  pull_request:
    paths:
      - 'twa-manifest.json'
      - 'manifest.webmanifest'
      - '.well-known/assetlinks.json'
      - 'android_twa_assets.js'
      - '.github/workflows/android-twa-unsigned.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap non-interactively
        run: |
          SDK_ROOT=/tmp/datoya-android-sdk
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$SDK_ROOT/bin"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/lib" "$SDK_ROOT/lib"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Generate Android project
        run: |
          set +e
          timeout 15s bubblewrap update --skipVersionUpgrade
          code=$?
          set -e
          test -f build.gradle || test -f app/build.gradle || { echo "Bubblewrap no generó el proyecto Android"; exit ${code:-1}; }
          echo "Proyecto Android generado correctamente."

      - name: Accept Android licenses and install required SDK
        run: |
          SDK_ROOT=/tmp/datoya-android-sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;35.0.0" "platforms;android-36"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"

      - name: Build unsigned APK and AAB
        env:
          ANDROID_HOME: /tmp/datoya-android-sdk
          ANDROID_SDK_ROOT: /tmp/datoya-android-sdk
        run: bubblewrap build --skipSigning --skipPwaValidation

      - name: Collect artifacts
        run: |
          mkdir -p android-output
          find . -maxdepth 5 -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} android-output/ \;

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datoya-android-unsigned
          path: android-output/*
          if-no-files-found: error
