name: Android TWA unsigned build

on:
  pull_request:
    paths:
      - 'twa-manifest.json'
      - 'manifest.webmanifest'
      - '.well-known/assetlinks.json'
      - 'android_twa_assets.js'
      - '.github/workflows/android-twa-unsigned.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Android project with Bubblewrap container
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade

      - name: Build unsigned APK and AAB
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --skipSigning --skipPwaValidation

      - name: Collect artifacts
        run: |
          mkdir -p android-output
          find . -maxdepth 5 -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} android-output/ \;

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datoya-android-unsigned
          path: android-output/*
          if-no-files-found: error
