name: DatoYa dependency security fix

on:
  push:
    branches:
      - security/dependency-audit

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only
      - name: Require clean production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Commit lockfile fix
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "DatoYa Security Bot"
          git config user.email "security@datoya.cl"
          git add package-lock.json package.json
          git commit -m "Fix vulnerable transitive dependencies"
          git push origin HEAD:security/dependency-audit
