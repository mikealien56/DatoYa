name: DatoYa PostgreSQL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: datoya
          POSTGRES_PASSWORD: datoya_test
          POSTGRES_DB: datoya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datoya -d datoya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://datoya:datoya_test@localhost:5432/datoya_test
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Create DatoYa PostgreSQL schema
        run: npm run migrate:postgres
      - name: Verify critical tables and constraints
        run: |
          PGPASSWORD=datoya_test psql -h localhost -U datoya -d datoya_test -v ON_ERROR_STOP=1 <<'SQL'
          SELECT COUNT(*) AS tables FROM information_schema.tables WHERE table_schema='public';
          SELECT key,value FROM settings ORDER BY key;
          INSERT INTO users(email,password_hash,name,role) VALUES('pg-smoke@datoya.cl','x:y','PG Smoke','cliente');
          INSERT INTO regions(name,code) VALUES('Test Region','TST');
          INSERT INTO comunas(region_id,name) SELECT id,'Test Comuna' FROM regions WHERE code='TST';
          UPDATE users SET comuna_id=(SELECT id FROM comunas WHERE name='Test Comuna') WHERE email='pg-smoke@datoya.cl';
          SELECT id,email,role FROM users WHERE email='pg-smoke@datoya.cl';
          SQL
      - name: Run PostgreSQL core marketplace flow
        run: node postgres_core_smoke.js
