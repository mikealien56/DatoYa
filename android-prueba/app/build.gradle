plugins { id 'com.android.application' }

android {
    namespace 'cl.datoya.pruebas2026'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.datoya.pruebas2026'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0-pruebas'
    }
    signingConfigs {
        stableTest {
            def filePath = System.getenv('DATOYA_SIGNING_KEYSTORE')
            def pass = System.getenv('DATOYA_STORE_PASSWORD')
            if (filePath && pass) {
                storeFile file(filePath)
                storePassword pass
                keyAlias 'datoya-pruebas'
                keyPassword pass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableTest
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
