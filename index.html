<script>
(function(){
  const img=document.getElementById('datoya-header-logo');
  if(!img)return;
  function clearBlackBackground(){
    if(img.dataset.transparentFixed==='1'||!img.naturalWidth)return;
    try{
      const w=img.naturalWidth,h=img.naturalHeight;
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
      const image=ctx.getImageData(0,0,w,h),d=image.data;
      let minX=w,minY=h,maxX=-1,maxY=-1;
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const i=(y*w+x)*4,r=d[i],g=d[i+1],b=d[i+2];
          const hi=Math.max(r,g,b),lo=Math.min(r,g,b);
          const background=hi<=60&&(hi-lo)<=18;
          if(background){d[i+3]=0;}
          else if(d[i+3]){if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;}
        }
      }
      ctx.putImageData(image,0,0);
      if(maxX<minX||maxY<minY)return;
      const pad=2,x0=Math.max(0,minX-pad),y0=Math.max(0,minY-pad),x1=Math.min(w-1,maxX+pad),y1=Math.min(h-1,maxY+pad);
      const out=document.createElement('canvas');out.width=x1-x0+1;out.height=y1-y0+1;
      out.getContext('2d').drawImage(canvas,x0,y0,out.width,out.height,0,0,out.width,out.height);
      const transparentLogo=out.toDataURL('image/png');
      img.dataset.transparentFixed='1';
      img.src=transparentLogo;
      const fav=document.getElementById('datoya-favicon');if(fav){fav.type='image/png';fav.href=transparentLogo;}
    }catch(e){console.warn('[DatoYa] No se pudo transparentar el fondo del logo',e);}
  }
  img.addEventListener('load',clearBlackBackground);
  if(img.complete)requestAnimationFrame(clearBlackBackground);
})();
</script>
